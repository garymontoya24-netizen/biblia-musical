<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblia Musical</title>
<meta name="description" content="Cuaderno de composición de la Biblia Musical">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblia Musical">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13161C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cuaderno de compositor — mapa de los 66 libros → obras → números → hojas de pentagrama a mano alzada */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#1E2230; --muted:#5D6371; --rule:#D8DCD5;
  --accent:#24456B; --accent-soft:#E3EAF3; --gold:#9A7019; --danger:#9B2C2C;
  --s0:#9AA0AA; --s1:#6E7FA0; --s2:#3F6596; --s3:#24456B; --s4:#7A5C9E; --s5:#A0712A; --s6:#9A7019; --s7:#3E7A55; --s8:#2E6B45;
  --f-display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Avenir Next", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161C; --surface:#1B1F27; --ink:#E6E8EC; --muted:#9AA1AE; --rule:#2D323C;
  --accent:#93B3DD; --accent-soft:#22314A; --gold:#D6AE52; --danger:#E08080;
  --s0:#6B7280; --s1:#7F90B0; --s2:#7FA3D3; --s3:#93B3DD; --s4:#B49AD6; --s5:#D4A15A; --s6:#D6AE52; --s7:#79C095; --s8:#5FB884;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161C; --surface:#1B1F27; --ink:#E6E8EC; --muted:#9AA1AE; --rule:#2D323C;
  --accent:#93B3DD; --accent-soft:#22314A; --gold:#D6AE52; --danger:#E08080;
  --s0:#6B7280; --s1:#7F90B0; --s2:#7FA3D3; --s3:#93B3DD; --s4:#B49AD6; --s5:#D4A15A; --s6:#D6AE52; --s7:#79C095; --s8:#5FB884;
  color-scheme:dark}
html,body{height:100%}
body{margin:0;touch-action:manipulation;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono);font-size:.82em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:1.65rem;letter-spacing:.01em}
.brand .clef{font-family:var(--f-display);font-size:1.9rem;color:var(--gold);line-height:1}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:transparent;padding:10px 16px;border-radius:999px;font-weight:500;color:var(--muted);min-height:44px}
.tab[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.banner{max-width:1180px;margin:10px auto 0;padding:0 20px}
.banner p{margin:0;padding:10px 14px;border:1px dashed var(--rule);border-radius:var(--radius);font-size:.92rem;color:var(--muted)}

main{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 80px}
.view-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.view-head h2{font-size:2.2rem}
.view-head p{margin:4px 0 0;max-width:62ch;color:var(--muted)}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:9px 16px;min-height:44px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);display:inline-grid;place-items:center;font-size:1rem}

/* Mapa */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 26px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--s0);flex:none}
.testament{margin-bottom:34px}
.testament > h3{font-size:1.5rem;margin-bottom:14px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.section{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--rule)}
.section-info h4{margin:0;font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.section-info p{margin:4px 0 0;font-size:.85rem;color:var(--muted)}
.books{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-width:0}
.book{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:44px}
.book .count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.book.has{border-color:var(--accent)}
@media (max-width:700px){.section{grid-template-columns:1fr}}

/* Drawer */
.drawer-back{position:fixed;inset:0;background:rgba(10,12,18,.35);z-index:40}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;padding:calc(env(safe-area-inset-top,0px) + 22px) 22px 22px;overflow:auto;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:16px}
.drawer h3{font-size:1.9rem}

/* Obras */
.obra-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.obra-card{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.obra-card h3{font-size:1.45rem}
.obra-card .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:500;padding:3px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.progress{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.progress i{height:4px;border-radius:2px;background:var(--rule)}
.empty{border:1px dashed var(--rule);border-radius:var(--radius);padding:26px;color:var(--muted);text-align:center}
.block-title{display:flex;align-items:center;gap:12px;margin:36px 0 14px}
.block-title h3{font-size:1.5rem}

/* Obra detail */
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.title-input{font-family:var(--f-display);font-size:2.3rem;font-weight:600;border:0;background:transparent;width:100%;padding:2px 0;border-bottom:1px solid transparent}
.title-input:focus{outline:none;border-bottom-color:var(--rule)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px;margin:14px 0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:44px;width:100%}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field.wide{grid-column:1/-1}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stage{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;min-height:38px;color:var(--muted)}
.stage[aria-pressed="true"]{color:var(--bg);border-color:transparent}

.num-list{border-top:1px solid var(--rule)}
.num{border-bottom:1px solid var(--rule)}
.num-row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 4px;width:100%;border:0;background:transparent;text-align:left;min-height:56px}
.num-row .n{font-family:var(--f-mono);color:var(--gold);font-size:1rem}
.num-row .t{display:flex;flex-direction:column;min-width:0}
.num-row .t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num-row .t small{color:var(--muted);font-size:.85rem}
.num-row .tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.num-body{padding:4px 4px 22px 64px}
@media (max-width:700px){.num-body{padding-left:4px}}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:10px}
.sheet-card{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;text-align:left}
.sheet-card .thumb{aspect-ratio:1/1.414;width:100%;max-width:100%;background:#FBFBF8;border-radius:4px;overflow:hidden;display:grid;place-items:center}
.sheet-card .thumb img{width:100%;height:100%;object-fit:cover}
.sheet-card span{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-new{border-style:dashed;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.95rem;flex:1;min-height:0}
.sheet-new small{font-size:.75rem}
.sheet-new-group{display:flex;flex-direction:column;gap:8px;aspect-ratio:1/1.55}
.score-thumb{display:flex!important;flex-direction:column;gap:6px;padding:6px;text-align:center;font-size:.72rem}
/* Partitura */
.score-studio .palette{gap:6px}
.mini{display:inline-flex;align-items:center;gap:4px;font-size:.88rem;white-space:nowrap;flex:none}
.mini input{width:62px;border:1px solid var(--rule);border-radius:8px;min-height:40px;padding:4px 8px;background:var(--surface)}
.mini.lyr input{width:110px}
.tool.acc{font-size:1.35rem;font-family:var(--f-display)}
.tool.play{font-weight:700;color:var(--accent)}
.score-wrap{flex:1;overflow:auto;position:relative;background:#FBFBF8;-webkit-overflow-scrolling:touch}
.score{padding:12px}
.score .strip{position:relative;width:max-content}
.strip-names{position:sticky;left:0;width:0;height:0;z-index:2}
.strip-names span{position:absolute;left:0;font-size:.75rem;color:#5D6371;background:rgba(251,251,248,.92);padding:2px 6px 2px 2px;border-radius:0 6px 6px 0;white-space:nowrap}
.score.paged{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:22px;width:max-content;min-width:100%;background:#D9DCD5}
.pg{position:relative;background:#FFFFFF;box-shadow:0 2px 12px rgba(0,0,0,.18);flex:none}
.pg svg{position:absolute;inset:0}
.pg-title{position:absolute;left:0;right:0;top:46px;text-align:center;color:#1B1E2A;pointer-events:none}
.pg-title h2{font-size:1.9rem;color:#1B1E2A}
.pg-title p{margin:4px 0 0;font-size:.9rem;color:#5D6371}
.pg-num{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:.8rem;color:#5D6371;pointer-events:none}
.seg{display:flex;gap:2px;flex:none;border:1px solid var(--rule);border-radius:12px;padding:2px}
.score svg{display:block;cursor:crosshair}
.playhead{position:absolute;width:20px;border-radius:6px;background:rgba(31,78,153,.16);pointer-events:none}
.score-help{flex:none;padding:6px 14px;font-size:.85rem;color:var(--muted);background:var(--surface);border-top:1px solid var(--rule)}
.piano{flex:none;background:var(--surface);border-top:1px solid var(--rule);padding:6px 10px 10px}
.pz-oct{display:flex;align-items:center;justify-content:center;gap:12px;font-size:.85rem;color:var(--muted)}
.pz-keys{position:relative;height:120px;margin-top:4px}
.pz-w{position:absolute;top:0;bottom:0;background:#FFFFFF;border:1px solid #9AA0AA;border-radius:0 0 6px 6px}
.pz-b{position:absolute;top:0;height:62%;background:#1B1E2A;border:0;border-radius:0 0 4px 4px;z-index:1}
.pz-w:active{background:#DCE6F4}.pz-b:active{background:#3F6596}
.inst{border:1px solid var(--rule);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px}

/* Cuaderno */
body.drawing{overflow:hidden}
body.drawing .top, body.drawing main, body.drawing .banner{display:none}
.studio{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:30;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--surface);overflow-x:auto;-webkit-overflow-scrolling:touch;flex:none}
.toolbar .sep{width:1px;height:28px;background:var(--rule);flex:none}
.toolbar .grp{display:flex;gap:4px;flex:none;align-items:center}
.tool{min-width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;padding:0 10px;font-size:.88rem;flex:none}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--rule)}
.tool[aria-pressed="true"] .swatch{box-shadow:0 0 0 2px var(--accent)}
.sheet-title{border:0;background:transparent;font-family:var(--f-display);font-size:1.3rem;font-weight:600;min-width:140px;max-width:260px;padding:4px}
.toolbar select{border:1px solid var(--rule);background:var(--surface);border-radius:8px;min-height:40px;padding:4px 8px}
.status{font-size:.8rem;color:var(--muted);white-space:nowrap;min-width:92px;text-align:right}
.wrap{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;background:var(--rule)}
.page{position:relative;margin:18px auto;box-shadow:0 2px 14px rgba(0,0,0,.18);background:#FBFBF8;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.88rem;pointer-events:none;opacity:0;transition:opacity .3s}
.hint.show{opacity:.92}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
.banner p button{margin-left:8px;border:0;background:transparent;color:var(--accent);font-weight:700;min-height:32px}
.backup-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="clef" aria-hidden="true">𝄞</span><h1>Biblia Musical</h1></div>
    <nav class="tabs" aria-label="Secciones">
      <button class="tab" id="tab-mapa" data-go="mapa">Mapa de la Biblia</button>
      <button class="tab" id="tab-obras" data-go="obras">Obras y bocetos</button>
      <button class="tab" id="tab-respaldo">Respaldo <span class="backup-dot" id="backup-dot" hidden></span></button>
    </nav>
  </div>
</header>
<div class="banner" id="banner" hidden><p><span id="banner-text"></span><button id="banner-x" aria-label="Cerrar aviso">Cerrar</button></p></div>
<div class="banner" id="install" hidden><p>Para instalarla en el iPad: toca <b>Compartir</b> (el cuadrado con la flecha) → <b>Agregar a pantalla de inicio</b>. Instalada, funciona sin internet y el iPad no borra tus datos.<button id="install-x">Entendido</button></p></div>
<div class="banner" id="update" hidden><p>Hay una versión nueva del cuaderno.<button id="update-go">Actualizar</button></p></div>
<main id="main"><div class="empty">Abriendo tu cuaderno…</div></main>
<div id="overlay"></div>

<script>
"use strict";
/* ───────── Datos de referencia (fijos) ───────── */
const SECCIONES = [
  {id:"pent", t:"AT", n:"Pentateuco", forma:"Oratorio", modelo:"Handel, Israel en Egipto · Haydn, La Creación",
    libros:["Génesis","Éxodo","Levítico","Números","Deuteronomio"]},
  {id:"hist", t:"AT", n:"Libros históricos", forma:"Oratorio", modelo:"Handel, Josué · Saúl · Salomón · Ester",
    libros:["Josué","Jueces","Rut","1 Samuel","2 Samuel","1 Reyes","2 Reyes","1 Crónicas","2 Crónicas","Esdras","Nehemías","Ester"]},
  {id:"poet", t:"AT", n:"Poéticos y sapienciales", forma:"Salterio / cantata", modelo:"Salterio de Ginebra · Schütz, Psalmen Davids",
    libros:["Job","Salmos","Proverbios","Eclesiastés","Cantares"]},
  {id:"pmay", t:"AT", n:"Profetas mayores", forma:"Oratorio", modelo:"Handel, El Mesías (parte I) · Belsasar",
    libros:["Isaías","Jeremías","Lamentaciones","Ezequiel","Daniel"]},
  {id:"pmen", t:"AT", n:"Profetas menores", forma:"Cantata", modelo:"Mendelssohn, Elías (lenguaje profético)",
    libros:["Oseas","Joel","Amós","Abdías","Jonás","Miqueas","Nahúm","Habacuc","Sofonías","Hageo","Zacarías","Malaquías"]},
  {id:"evan", t:"NT", n:"Evangelios", forma:"Pasión / oratorio", modelo:"Bach, Pasión según San Mateo y San Juan · Schütz, Historias",
    libros:["Mateo","Marcos","Lucas","Juan"]},
  {id:"hech", t:"NT", n:"Hechos", forma:"Oratorio", modelo:"Mendelssohn, Paulus",
    libros:["Hechos"]},
  {id:"paul", t:"NT", n:"Epístolas paulinas", forma:"Cantata", modelo:"Bach, cantatas de iglesia",
    libros:["Romanos","1 Corintios","2 Corintios","Gálatas","Efesios","Filipenses","Colosenses","1 Tesalonicenses","2 Tesalonicenses","1 Timoteo","2 Timoteo","Tito","Filemón"]},
  {id:"gene", t:"NT", n:"Epístolas generales", forma:"Cantata / motete", modelo:"Bach, motetes · Brahms, Un réquiem alemán",
    libros:["Hebreos","Santiago","1 Pedro","2 Pedro","1 Juan","2 Juan","3 Juan","Judas"]},
  {id:"apoc", t:"NT", n:"Apocalipsis", forma:"Oratorio", modelo:"Franz Schmidt, El libro de los siete sellos",
    libros:["Apocalipsis"]},
];
const LIBROS = SECCIONES.flatMap(s => s.libros);
const FORMAS = ["Oratorio","Pasión","Cantata","Salterio","Motete","Coral / himno","Otra"];
const ESTADOS = ["Idea","Estudio","Libreto","Bocetos","Composición","Orquestación","Revisión","Ensayo","Estrenada"];
const TIPOS = ["Sinfonía","Coro","Recitativo","Arioso","Aria","Dúo","Coral","Turba","Fuga","Interludio","Otro"];
const PAPELES = [
  {id:"pent", n:"Pentagrama (12)"},
  {id:"piano", n:"Piano (6 sistemas)"},
  {id:"satb", n:"Coro SATB (3 sistemas)"},
  {id:"orq", n:"Orquesta (18)"},
  {id:"libre", n:"Libre (puntos)"},
];
const COLORES = [{c:"#1B1E2A",n:"Tinta"},{c:"#A12A2A",n:"Rojo"},{c:"#1F4E99",n:"Azul"},{c:"#2D7A4B",n:"Verde"}];
const GROSORES = [{w:1.6,n:"Fino"},{w:2.8,n:"Medio"},{w:5,n:"Grueso"}];
const W = 1000, H = 1414;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stageColor = i => `var(--s${Math.max(0,Math.min(8,i))})`;
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};

/* ───────── Almacenamiento: IndexedDB en este iPad ───────── */
const IDB = {
  db: null, STORES: ["obras","numeros","hojas","trazos"],
  open(){ return new Promise((res, rej) => {
    const rq = indexedDB.open("biblia-musical", 1);
    rq.onupgradeneeded = () => { for (const n of this.STORES) if (!rq.result.objectStoreNames.contains(n)) rq.result.createObjectStore(n); };
    rq.onsuccess = () => { this.db = rq.result; res(); };
    rq.onerror = () => rej(rq.error);
  }); },
  write(store, fn){ return new Promise((res, rej) => {
    const t = this.db.transaction(store, "readwrite"); fn(t.objectStore(store));
    t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error("abort"));
  }); },
  entries(store, range){ return new Promise((res, rej) => {
    const out = [], c = this.db.transaction(store).objectStore(store).openCursor(range);
    c.onsuccess = () => { const cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue(); } else res(out); };
    c.onerror = () => rej(c.error);
  }); },
};
const Store = {
  mode: "pending", cache: {obras:new Map(), numeros:new Map(), hojas:new Map()}, watchers: {},
  async init(){
    try { await IDB.open(); this.mode = "idb";
      for (const coll of Object.keys(this.cache)) for (const [k, v] of await IDB.entries(coll)) this.cache[coll].set(k, v);
    } catch (e) { this.mode = "memory"; showBanner("Este navegador no permite guardar datos (¿navegación privada?). Lo que hagas ahora se perderá al cerrar."); }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  },
  list(coll){ return [...this.cache[coll]].map(([id, v]) => Object.assign({id}, v)); },
  notify(coll){ (this.watchers[coll] || []).forEach(f => f(this.list(coll))); },
  watch(coll, cb){ (this.watchers[coll] = this.watchers[coll] || []).push(cb); cb(this.list(coll)); return () => {}; },
  async put(coll, id, v){ if (this.mode === "idb") await IDB.write(coll, os => os.put(v, id)); },
  async set(coll, id, data){ this.cache[coll].set(id, Object.assign({}, data)); this.notify(coll); await this.put(coll, id, this.cache[coll].get(id)); },
  async update(coll, id, patch){ const cur = this.cache[coll].get(id); if (!cur) return; Object.assign(cur, patch); this.notify(coll); await this.put(coll, id, cur); },
  async del(coll, id){ this.cache[coll].delete(id); this.notify(coll); if (this.mode === "idb") await IDB.write(coll, os => os.delete(id)); },
  mem: new Map(),
  async getChunks(hid){
    if (this.mode !== "idb") return [...this.mem].filter(([k]) => k.startsWith(hid + ":")).map(([k, v]) => Object.assign({}, v, {k:Number(k.split(":")[1]), s:v.s || []}));
    const rows = await IDB.entries("trazos", IDBKeyRange.bound(hid + ":", hid + ":￿"));
    return rows.map(([k, v]) => Object.assign({}, v, {k:Number(String(k).split(":")[1]), s:v.s || []}));
  },
  async setChunk(hid, k, data){ if (this.mode !== "idb") { this.mem.set(hid + ":" + k, data); return; } await IDB.write("trazos", os => os.put(data, hid + ":" + k)); },
  async delChunks(hid, n){ if (this.mode !== "idb") { for (let k = 0; k < n; k++) this.mem.delete(hid + ":" + k); return; }
    await IDB.write("trazos", os => os.delete(IDBKeyRange.bound(hid + ":", hid + ":￿"))); },
};

function go(view, opts = {}){
  S.view = view; if (opts.obraId !== undefined) S.obraId = opts.obraId;
  if (view === "obra" && opts.obraId !== undefined) S.openNum = null;
  ls.set("bm:view", view); ls.set("bm:obra", S.obraId);
  closeDrawer(); render(true); window.scrollTo(0, 0);
}
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));

/* Debounced writes per field */
const pending = new Map();
const creating = {obras:new Map(), numeros:new Map(), hojas:new Map()};
async function createDoc(coll, id, data){ creating[coll].set(id, Object.assign({id}, data)); try { await Store.set(coll, id, data); } finally { creating[coll].delete(id); } }
function queueUpdate(coll, id, patch, delay = 600){
  const key = coll+"/"+id;
  const cur = pending.get(key) || {patch:{}, t:0};
  Object.assign(cur.patch, patch); clearTimeout(cur.t);
  cur.t = setTimeout(() => { pending.delete(key); Store.update(coll, id, cur.patch).catch(e => showBanner("No se pudo guardar: " + (e.message || e.code))); }, delay);
  pending.set(key, cur);
  const arr = S[coll], item = byId(arr, id); if (item) Object.assign(item, patch);
}

/* ───────── Render ───────── */
let lastSig = "";
function render(force){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", String(t.dataset.go === S.view || (S.view === "obra" && t.dataset.go === "obras"))));
  if (Store.mode === "pending") return;
  if (S.view === "obra" && !byId(S.obras, S.obraId) && S.loaded.obras) { S.view = "obras"; }
  if (S.view === "mapa") return renderMapa();
  if (S.view === "obras") return renderObras();
  if (S.view === "obra") return renderObra(force);
}

function obraStage(o){ return Math.max(0, ESTADOS.indexOf(o.estado)); }
function stagePill(e){ const i = Math.max(0, ESTADOS.indexOf(e)); return `<span class="pill" style="color:${stageColor(i)}"><span class="dot" style="background:${stageColor(i)}"></span>${esc(e || ESTADOS[0])}</span>`; }
function progressBar(i){ return `<div class="progress" aria-label="Etapa ${i+1} de 9">${ESTADOS.map((_, k) => `<i style="${k <= i ? "background:"+stageColor(i) : ""}"></i>`).join("")}</div>`; }

function renderMapa(){
  const total = S.obras.length;
  const libsCon = new Set(S.obras.map(o => o.libro)).size;
  let h = `<div class="view-head"><div><div class="eyebrow">66 libros · ${libsCon} con obra en marcha · ${total} obra${total===1?"":"s"}</div><h2>Mapa de la Biblia</h2>
    <p>Cada libro es una puerta. Toca uno para ver sus obras o comenzar una nueva. Al lado de cada grupo va la forma sugerida y los modelos para estudiar.</p></div></div>
    <div class="legend">${ESTADOS.map((e,i) => `<span><span class="dot" style="background:${stageColor(i)}"></span>${e}</span>`).join("")}</div>`;
  for (const t of ["AT","NT"]) {
    h += `<section class="testament"><h3>${t === "AT" ? "Antiguo Testamento" : "Nuevo Testamento"}</h3>`;
    for (const s of SECCIONES.filter(x => x.t === t)) {
      h += `<div class="section"><div class="section-info"><h4>${s.n}</h4><p><b>${s.forma}</b><br>${s.modelo}</p></div><div class="books">`;
      for (const l of s.libros) {
        const os = S.obras.filter(o => o.libro === l);
        const top = os.length ? Math.max(...os.map(obraStage)) : -1;
        h += `<button class="book ${os.length ? "has" : ""}" data-libro="${esc(l)}">${top >= 0 ? `<span class="dot" style="background:${stageColor(top)}"></span>` : ""}${esc(l)}${os.length ? `<span class="count">${os.length}</span>` : ""}</button>`;
      }
      h += `</div></div>`;
    }
    h += `</section>`;
  }

}

function seccionDe(libro){ return SECCIONES.find(s => s.libros.includes(libro)); }
function closeDrawer(){ document.getElementById("overlay").innerHTML = ""; }
function openBook(libro){
  const s = seccionDe(libro), os = S.obras.filter(o => o.libro === libro);
  const ov = document.getElementById("overlay");
  ov.innerHTML = `<div class="drawer-back" data-close></div><aside class="drawer" role="dialog" aria-label="${esc(libro)}">

    <button class="btn primary" data-new>Nueva obra sobre ${esc(libro)}</button></aside>`;
  ov.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeDrawer));

async function newObra(libro){
  const s = seccionDe(libro) || SECCIONES[0];
  const forma = FORMAS.find(f => s.forma.toLowerCase().startsWith(f.toLowerCase())) || "Oratorio";
  const id = uid();
  const o = {titulo: `${forma} sobre ${libro}`, libro, forma, estado:"Idea", referencia:"", duracion:"", plantilla:"", notas:"", createdAt: Date.now()};
  S.obras.push(Object.assign({id}, o));
  go("obra", {obraId:id});
  try { await createDoc("obras", id, o); } catch (e) { showBanner("No se pudo crear la obra: " + (e.message || e.code)); }
}

function obraSig(o){ return [o.id, numsOf(o.id).map(n => n.id).join(","), S.hojas.filter(h => h.obraId === o.id).map(h => h.id + (h.thumb ? h.thumb.length : 0) + (h.titulo||"")).join(","), S.openNum].join("|"); }
function patchValues(root, data){
  root.querySelectorAll("[data-f]").forEach(el => {

function makeThumb(){
  const c = document.createElement("canvas"); c.width = 240; c.height = Math.round(240 * H / W);
  const x = c.getContext("2d"); x.scale(240 / W, 240 / W); drawPaper(x, D.sheet.papel); for (const s of D.strokes) drawStroke(x, s);
  try { return c.toDataURL("image/jpeg", 0.72); } catch { return ""; }
}
async function saveFile(blob, filename){
  try {
    const file = new File([blob], filename, {type: blob.type});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:filename}); return true; }
  } catch (e) { if (e && e.name === "AbortError") return false; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000); return true;
}
async function exportPNG(){
  const c = document.createElement("canvas"); c.width = W * 2; c.height = H * 2;
  const x = c.getContext("2d"); x.scale(2, 2); drawPaper(x, D.sheet.papel); for (const s of D.strokes) drawStroke(x, s);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const name = (D.sheet.titulo || "hoja").replace(/[^\p{L}\p{N} _-]/gu, "").trim() || "hoja";
  if (await saveFile(blob, name + ".png")) hint("Imagen lista");
}
function teardown(){ window.removeEventListener("resize", onResize); if (D.el) D.el.remove(); D.el = null; D.sheet = null; document.body.classList.remove("drawing"); }
async function closeSheet(){ const h = D.sheet; await flushSave(); teardown(); lastSig = ""; render(true); if (h && h.numeroId && S.view === "obra") S.openNum = h.numeroId; render(true); }

/* ───────── Arranque ───────── */
(async function start(){
  await Store.init();
  for (const coll of ["obras","numeros","hojas"]) {
    Store.watch(coll, list => {
      // keep local edits that haven't been flushed yet
      for (const it of list) { const p = pending.get(coll+"/"+it.id); if (p) Object.assign(it, p.patch); }
      if (coll === "hojas" && D.sheet) { const live = list.find(x => x.id === D.sheet.id); if (live) Object.assign(live, {thumb:D.sheet.thumb, chunks:D.nChunks}); }
      for (const [id, it] of creating[coll]) if (!list.some(x => x.id === id)) list.push(it);
      S[coll] = list; S.loaded[coll] = true;
      if (D.sheet) { const again = byId(S.hojas, D.sheet.id); if (again) D.sheet = Object.assign(again, {papel:D.sheet.papel, titulo:D.sheet.titulo}); }
      render(false); paintBackupDot();
    });
  }
  render(true);
})();
window.addEventListener("pagehide", () => { if (D.sheet && D.dirty.size) saveSheet(); });

/* ───────── Respaldo ───────── */
const DAY = 864e5;
function paintBackupDot(){ const last = ls.get("bm:lastBackup", 0), any = S.obras.length || S.hojas.length;
  document.getElementById("backup-dot").hidden = !(any && Date.now() - last > 7 * DAY); }
function fmtDate(t){ return t ? new Date(t).toLocaleDateString("es-CO", {day:"numeric", month:"long", year:"numeric"}) : "nunca"; }
function openBackup(){
  const ov = document.getElementById("overlay");
  ov.innerHTML = `<div class="drawer-back" data-close></div><aside class="drawer" role="dialog" aria-label="Respaldo">
    <div style="display:flex;gap:10px"><h3 style="flex:1">Respaldo</h3><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
    <p style="margin:0">Todo tu trabajo vive en este iPad. Haz una copia cada semana y guárdala en <b>Archivos → iCloud Drive</b>. Si cambias de iPad o algo falla, la restauras desde aquí.</p>
    <p class="muted" style="margin:0">Última copia: <b>${fmtDate(ls.get("bm:lastBackup", 0))}</b> · ${S.obras.length} obras · ${S.numeros.length} números · ${S.hojas.length} hojas</p>
    <button class="btn primary" id="bk-export">Guardar copia de seguridad</button>
    <div class="field"><label for="bk-file">Restaurar una copia</label><input type="file" id="bk-file" accept=".json,application/json"></div>
    <p class="muted" style="margin:0;font-size:.9rem">Restaurar agrega lo que hay en la copia y reemplaza lo que tenga el mismo nombre interno. No borra lo demás.</p>
    <p id="bk-msg" style="margin:0"></p></aside>`;
  ov.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeDrawer));
  const msg = t => { document.getElementById("bk-msg").textContent = t; };
  document.getElementById("bk-export").addEventListener("click", async () => {
    if (D.sheet) await flushSave();
    msg("Preparando copia…");
    const out = {app:"biblia-musical", formato:1, exportado:new Date().toISOString()};
    for (const c of ["obras","numeros","hojas"]) out[c] = Object.fromEntries(Store.cache[c]);
    out.trazos = Store.mode === "idb" ? Object.fromEntries(await IDB.entries("trazos")) : Object.fromEntries(Store.mem);
    const d = new Date(), name = `biblia-musical-respaldo-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
    const ok = await saveFile(new Blob([JSON.stringify(out)], {type:"application/json"}), name);
    if (ok) { ls.set("bm:lastBackup", Date.now()); paintBackupDot(); msg("Copia lista: " + name); } else msg("Copia cancelada.");
  });
  document.getElementById("bk-file").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.app !== "biblia-musical") throw new Error("Este archivo no es una copia de la Biblia Musical.");
      for (const c of ["obras","numeros","hojas"]) for (const [id, v] of Object.entries(data[c] || {})) await Store.set(c, id, v);
      for (const [k, v] of Object.entries(data.trazos || {})) { const i = k.lastIndexOf(":"); await Store.setChunk(k.slice(0, i), Number(k.slice(i + 1)), v); }
      msg(`Restaurado: ${Object.keys(data.obras || {}).length} obras y ${Object.keys(data.hojas || {}).length} hojas.`); render(true);
    } catch (err) { msg("No se pudo restaurar: " + (err.message || err)); }
  });
}
document.getElementById("tab-respaldo").addEventListener("click", openBackup);
document.getElementById("banner-x").addEventListener("click", () => { document.getElementById("banner").hidden = true; });

/* ───────── Instalación y actualizaciones ───────── */
(function(){
  const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  if (!standalone && !ls.get("bm:installHint", false)) document.getElementById("install").hidden = false;
  document.getElementById("install-x").addEventListener("click", () => { ls.set("bm:installHint", true); document.getElementById("install").hidden = true; });
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloading) { reloading = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js").then(reg => {
    const offer = w => { const b = document.getElementById("update"); b.hidden = false;
      document.getElementById("update-go").onclick = async () => { if (D.sheet) await flushSave(); w.postMessage("skipWaiting"); }; };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => { const w = reg.installing; if (!w) return;
      w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) offer(w); }); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {});
})();
